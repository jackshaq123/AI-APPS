{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h1>{{ t('login') }}</h1>
  {% if sent %}
    <p>{{ t('login_sent') }}</p>
  {% else %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="email">{{ t('login_prompt') }}</label>
    <div class="row">
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="{{ t('email_placeholder') }}">
      <button class="btn">{{ t('login') }}</button>
    </div>
  </form>
  {% endif %}
</section>
{% endblock %}
